name: Build Fcitx5-Osk (arm64, zh_CN)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libudev-dev libxkbcommon-dev libwayland-dev wayland-protocols
          python3 -m pip install --quiet --upgrade pip cmake
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone fcitx5-osk and apply zh_CN patch
        run: |
          git clone --depth 1 https://github.com/fortime/fcitx5-osk.git
          python3 - <<'PYEOF'
          import pathlib
          def patch(p, repl):
              p = pathlib.Path(p)
              s = p.read_text(encoding='utf-8').replace('\r\n', '\n')
              for a, b in repl:
                  if a not in s:
                      raise SystemExit('MISS in ' + str(p) + ': ' + repr(a))
                  s = s.replace(a, b)
              p.write_text(s, encoding='utf-8')
              print('patched', p)
          # field names (state/config.rs)
          patch('fcitx5-osk/fcitx5-osk/src/state/config.rs', [
            ('name: "Width",', 'name: "\u5bbd\u5ea6",'),
            ('name: "Placement",', 'name: "\u653e\u7f6e\u65b9\u5f0f",'),
            ('name: "Indicator Display",', 'name: "\u6307\u793a\u680f\u663e\u793a",'),
            ('name: "Manual Mode",', 'name: "\u624b\u52a8\u6a21\u5f0f",'),
            ('name: "Manual Mode(Session)",', 'name: "\u624b\u52a8\u6a21\u5f0f(\u4f1a\u8bdd)",'),
            ('name: "Ignore Fcitx Show",', 'name: "\u5ffd\u7565 Fcitx \u663e\u793a",'),
            ('name: "Quick Action Bar",', 'name: "\u5feb\u6377\u64cd\u4f5c\u680f",'),
            ('name: "Custom Actions",', 'name: "\u81ea\u5b9a\u4e49\u64cd\u4f5c",'),
            ('name: "Dark Theme",', 'name: "\u6697\u8272\u4e3b\u9898",'),
            ('name: "Light Theme",', 'name: "\u4eae\u8272\u4e3b\u9898",'),
            ('name: "Preferred Output",', 'name: "\u9996\u9009\u8f93\u51fa",'),
            ('name: "Preferred Output(Custom)",', 'name: "\u9996\u9009\u8f93\u51fa(\u81ea\u5b9a\u4e49)",'),
          ])
          # enums (config.rs)
          patch('fcitx5-osk/fcitx5-osk/src/config.rs', [
            ('    #[default]\n    Dock,\n', '    #[default]\n    #[strum(serialize = "\u505c\u9760")]\n    Dock,\n'),
            ('    Float,\n', '    #[strum(serialize = "\u6d6e\u7a97")]\n    Float,\n'),
            ('    #[default]\n    Auto,\n', '    #[default]\n    #[strum(serialize = "\u81ea\u52a8")]\n    Auto,\n'),
            ('    AlwaysOn,\n', '    #[strum(serialize = "\u59cb\u7ec8\u663e\u793a")]\n    AlwaysOn,\n'),
            ('    AlwaysOff,\n', '    #[strum(serialize = "\u59cb\u7ec8\u9690\u85cf")]\n    AlwaysOff,\n'),
            ('    #[default]\n    Off,\n', '    #[default]\n    #[strum(serialize = "\u5173\u95ed")]\n    Off,\n'),
            ('    On,\n', '    #[strum(serialize = "\u5f00\u542f")]\n    On,\n'),
            ('    Toggle,\n', '    #[strum(serialize = "\u5207\u6362")]\n    Toggle,\n'),
          ])
          print('zh patch applied OK')
          PYEOF

      - name: Build
        run: |
          cd fcitx5-osk
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          sudo cmake --install build --prefix install-dir --component Fcitx5Osk
          sudo cmake --install build --prefix install-dir --component Fcitx5OskKwinLauncher

      - name: Package
        run: |
          cd fcitx5-osk/install-dir
          tar czf ../../fcitx5-osk-zh-arm64.tar.gz .
          find . -type f | head -10
          du -sh .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcitx5-osk-zh-arm64
          path: fcitx5-osk-zh-arm64.tar.gz
          retention-days: 7
