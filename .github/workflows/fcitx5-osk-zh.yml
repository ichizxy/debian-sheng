name: Build Fcitx5-Osk (arm64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libudev-dev libxkbcommon-dev libwayland-dev wayland-protocols
          python3 -m pip install --quiet --upgrade pip cmake
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone fcitx5-osk and apply zh_CN patch
        run: |
          git clone --depth 1 https://github.com/fortime/fcitx5-osk.git
          python3 - <<'PYEOF'
          p = 'fcitx5-osk/fcitx5-osk/src/state/config.rs'
          s = open(p, encoding='utf-8').read()
          repl = [
            # field names
            ('name: "Width",', 'name: "瀹藉害",'),
            ('name: "Placement",', 'name: "鏀剧疆鏂瑰紡",'),
            ('name: "Indicator Display",', 'name: "鎸囩ず鏍忔樉绀?,'),
            ('name: "Manual Mode",', 'name: "鎵嬪姩妯″紡",'),
            ('name: "Manual Mode(Session)",', 'name: "鎵嬪姩妯″紡(浼氳瘽)",'),
            ('name: "Ignore Fcitx Show",', 'name: "蹇界暐 Fcitx 鏄剧ず",'),
            ('name: "Quick Action Bar",', 'name: "蹇嵎鎿嶄綔鏍?,'),
            ('name: "Custom Actions",', 'name: "鑷畾涔夋搷浣?,'),
            ('name: "Dark Theme",', 'name: "鏆楄壊涓婚",'),
            ('name: "Light Theme",', 'name: "浜壊涓婚",'),
            ('name: "Preferred Output",', 'name: "棣栭€夎緭鍑?,'),
            ('name: "Preferred Output(Custom)",', 'name: "棣栭€夎緭鍑?鑷畾涔?",'),
            # Placement
            ('    #[default]\n    Dock,\n', '    #[default]\n    #[strum(serialize = "鍋滈潬")]\n    Dock,\n'),
            ('    Float,\n', '    #[strum(serialize = "娴獥")]\n    Float,\n'),
            # IndicatorDisplay
            ('    #[default]\n    Auto,\n', '    #[default]\n    #[strum(serialize = "鑷姩")]\n    Auto,\n'),
            ('    AlwaysOn,\n', '    #[strum(serialize = "濮嬬粓鏄剧ず")]\n    AlwaysOn,\n'),
            ('    AlwaysOff,\n', '    #[strum(serialize = "濮嬬粓闅愯棌")]\n    AlwaysOff,\n'),
            # QuickActionBarState
            ('    #[default]\n    Off,\n', '    #[default]\n    #[strum(serialize = "鍏抽棴")]\n    Off,\n'),
            ('    On,\n', '    #[strum(serialize = "寮€鍚?)]\n    On,\n'),
            ('    Toggle,\n', '    #[strum(serialize = "鍒囨崲")]\n    Toggle,\n'),
          ]
          for a, b in repl:
              assert a in s, 'MISS: ' + a
              s = s.replace(a, b)
          open(p, 'w', encoding='utf-8').write(s)
          print('zh patch applied OK')
          PYEOF

      - name: Build
        run: |
          cd fcitx5-osk
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          sudo cmake --install build --prefix install-dir --component Fcitx5Osk
          sudo cmake --install build --prefix install-dir --component Fcitx5OskKwinLauncher

      - name: Package
        run: |
          cd fcitx5-osk/install-dir
          tar czf ../../fcitx5-osk-zh-arm64.tar.gz .
          find . -type f | head -10
          du -sh .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcitx5-osk-zh-arm64
          path: fcitx5-osk-zh-arm64.tar.gz
          retention-days: 7
